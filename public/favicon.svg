<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Teal rounded-square background -->
  <rect width="32" height="32" rx="7" fill="#1FA8A0"/>

  <!-- Letter H (white) -->
  <rect x="2"  y="5" width="3.5" height="22" rx="1" fill="white"/>
  <rect x="11" y="5" width="3.5" height="22" rx="1" fill="white"/>
  <rect x="2"  y="13" width="12.5" height="3.5" rx="1" fill="white"/>

  <!-- Letter R (white) -->
  <!-- vertical bar -->
  <rect x="17" y="5" width="3.5" height="22" rx="1" fill="white"/>
  <!-- D-bump (semicircle) -->
